<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Pi Trust Protocol - Güvenli Emanet</title>
    <script src="https://sdk.pi.network/dist/sdk.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
</head>
<body class="bg-gray-900 text-gray-200">

    <!-- GCV & DİL -->
    <div class="bg-gradient-to-r from-purple-800 to-indigo-900 text-white py-2 px-4 shadow-inner">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex items-center text-xs md:text-sm font-bold">
                <i class="fas fa-chart-line mr-2 text-yellow-400"></i>
                <span id="gcv-text">Küresel Konsensüs Değeri (GCV) Endeksi: <span class="text-yellow-400">1 Pi = $314,159</span></span>
            </div>
            <div class="flex space-x-2">
                <button onclick="setLanguage('tr')" class="bg-gray-800 hover:bg-gray-700 text-white text-xs px-2.5 py-1 rounded font-bold border border-gray-600 transition-colors">TR</button>
                <button onclick="setLanguage('en')" class="bg-gray-800 hover:bg-gray-700 text-white text-xs px-2.5 py-1 rounded font-bold border border-gray-600 transition-colors">EN</button>
            </div>
        </div>
    </div>

    <header class="bg-gray-800 p-4 text-center relative shadow-lg">
        <h1 class="text-2xl md:text-3xl font-bold text-white tracking-wide">🛡️ Pi Trust Protocol</h1>
    </header>

    <nav class="bg-gray-900 p-4 text-center border-b border-gray-800">
        <ul class="flex justify-center space-x-6 text-base md:text-lg">
            <li><a href="index.html" class="text-gray-400 hover:text-blue-400 id-nav-home"><i class="fas fa-home mr-2"></i>Ana Sayfa</a></li>
            <li><a href="escrow.html" class="text-blue-400 font-bold id-nav-escrow"><i class="fas fa-shield-alt mr-2"></i>Güvenli Emanet</a></li>
            <li><a href="transactions.html" class="text-gray-400 hover:text-blue-400 id-nav-tx"><i class="fas fa-history mr-2"></i>İşlemlerim</a></li>
            <li><a href="about.html" class="text-gray-400 hover:text-blue-400 id-nav-about"><i class="fas fa-info-circle mr-2"></i>Hakkımızda</a></li>
        </ul>
    </nav>

    <main class="p-6 max-w-2xl mx-auto">
        <div class="bg-gray-800 p-8 rounded-xl shadow-md border border-gray-700">
            <h2 class="text-2xl font-bold text-white mb-6 flex items-center" id="escrow-title">
                <i class="fas fa-file-contract mr-3 text-blue-500"></i>Yeni Emanet Havuzu Oluştur
            </h2>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold mb-2 text-gray-300" id="lbl-seller-adr">Satıcı Cüzdan Adresi</label>
                    <input type="text" id="seller-address" placeholder="GD3A..." class="w-full p-3 rounded bg-gray-700 text-white placeholder-gray-500 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-bold mb-2 text-gray-300" id="lbl-amount">Kilitlenecek Pi Miktarı</label>
                    <input type="number" step="any" id="pi-amount" oninput="calculateGcvEquivalent()" placeholder="Örn: 0.005" class="w-full p-3 rounded bg-gray-700 text-white placeholder-gray-500 focus:ring-2 focus:ring-blue-500 outline-none">
                    <span id="gcv-calc-label" class="text-xs text-yellow-400 font-semibold mt-1 block">GCV Karşılığı: $0.00</span>
                </div>

                <div>
                    <label class="block text-sm font-bold mb-2 text-gray-300" id="lbl-details">Ürün / Sözleşme Detayı</label>
                    <textarea id="contract-details" rows="3" placeholder="Araba satışı, yazılım teslimatı vb." class="w-full p-3 rounded bg-gray-700 text-white placeholder-gray-500 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>

                <button onclick="createEscrowPool()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg shadow-lg transition-colors flex justify-center items-center gap-2" id="btn-create-pool">
                    <i class="fas fa-lock"></i> Emaneti Kilitle ve Başlat
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-gray-800 text-gray-400 p-6 text-center border-t border-gray-700 mt-12">
        <p>© 2026 Pi Trust Protocol. Tüm hakları saklıdır.</p>
    </footer>

    <script>
        const GCV_RATE = 314159;

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('selectedLang') || 'tr';
            applyTranslations(savedLang);
        });

        function setLanguage(lang) {
            localStorage.setItem('selectedLang', lang);
            applyTranslations(lang);
        }

        function calculateGcvEquivalent() {
            const amount = parseFloat(document.getElementById('pi-amount').value) || 0;
            const dollarVal = (amount * GCV_RATE).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            document.getElementById('gcv-calc-label').innerText = `GCV Karşılığı: $${dollarVal}`;
        }

        function createEscrowPool() {
            const seller = document.getElementById('seller-address').value;
            const amount = document.getElementById('pi-amount').value;
            if(!seller || !amount) {
                alert("Lütfen tüm alanları doldurun.");
                return;
            }
            alert(`Havuz oluşturuluyor: ${amount} Pi emanet kasasında kilitlenecek.`);
        }

        function applyTranslations(lang) {
            if(lang === 'tr') {
                document.getElementById('gcv-text').innerHTML = 'Küresel Konsensüs Değeri (GCV) Endeksi: <span class="text-yellow-400">1 Pi = $314,159</span>';
                document.querySelector('.id-nav-home').innerHTML = '<i class="fas fa-home mr-2"></i>Ana Sayfa';
                document.querySelector('.id-nav-escrow').innerHTML = '<i class="fas fa-shield-alt mr-2"></i>Güvenli Emanet';
                document.querySelector('.id-nav-tx').innerHTML = '<i class="fas fa-history mr-2"></i>İşlemlerim';
                document.querySelector('.id-nav-about').innerHTML = '<i class="fas fa-info-circle mr-2"></i>Hakkımızda';
                document.getElementById('escrow-title').innerHTML = '<i class="fas fa-file-contract mr-3 text-blue-500"></i>Yeni Emanet Havuzu Oluştur';
                document.getElementById('lbl-seller-adr').innerText = 'Satıcı Cüzdan Adresi';
                document.getElementById('lbl-amount').innerText = 'Kilitlenecek Pi Miktarı';
                document.getElementById('lbl-details').innerText = 'Ürün / Sözleşme Detayı';
                document.getElementById('btn-create-pool').innerHTML = '<i class="fas fa-lock"></i> Emaneti Kilitle ve Başlat';
            } else {
                document.getElementById('gcv-text').innerHTML = 'Global Consensus Value (GCV) Index: <span class="text-yellow-400">1 Pi = $314,159</span>';
                document.querySelector('.id-nav-home').innerHTML = '<i class="fas fa-home mr-2"></i>Home';
                document.querySelector('.id-nav-escrow').innerHTML = '<i class="fas fa-shield-alt mr-2"></i>Secure Escrow';
                document.querySelector('.id-nav-tx').innerHTML = '<i class="fas fa-history mr-2"></i>My Transactions';
                document.querySelector('.id-nav-about').innerHTML = '<i class="fas fa-info-circle mr-2"></i>About Us';
                document.getElementById('escrow-title').innerHTML = '<i class="fas fa-file-contract mr-3 text-blue-500"></i>Create New Escrow Pool';
                document.getElementById('lbl-seller-adr').innerText = 'Seller Wallet Address';
                document.getElementById('lbl-amount').innerText = 'Pi Amount to Lock';
                document.getElementById('lbl-details').innerText = 'Product / Contract Details';
                document.getElementById('btn-create-pool').innerHTML = '<i class="fas fa-lock"></i> Lock Escrow & Start';
            }
            calculateGcvEquivalent();
        }
    </script>
</body>
</html>
