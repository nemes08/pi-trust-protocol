<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pi Trust Protocol</title>

    <!-- ===== 1. Pi Network Temel SDK'sı (Zorunlu) ===== -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>

    <style>
        /* ===== Stiller ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #2a3f6e;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        button {
            background: #4caf50;
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            width: 100%;
            transition: 0.3s;
        }
        button:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .wallet-btn {
            background: #2a3f6e;
            margin-bottom: 20px;
        }
        .product {
            background: #f8f9fa;
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            border: 1px solid #e9ecef;
        }
        .product h3 {
            color: #333;
            margin-bottom: 5px;
        }
        .price {
            color: #2a3f6e;
            font-size: 18px;
            font-weight: bold;
        }
        .buy-btn {
            background: #ff6b35;
            width: auto;
            padding: 10px 20px;
            margin-top: 10px;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }
        .status {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
        }
        .user-info {
            background: #e3f2fd;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 14px;
            color: #0d47a1;
            display: none;
        }
        .user-info.visible {
            display: block;
        }
        #productSection {
            display: none;
        }
        #productSection.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Pi Trust</h1>
        <p class="subtitle">Güvenli ticaretin yeni adresi</p>

        <!-- ===== 2. Kullanıcı Bilgisi ===== -->
        <div id="userInfo" class="user-info">
            ✅ Hoş geldin, <span id="usernameDisplay"></span>!
        </div>

        <!-- ===== 3. Giriş Butonu ===== -->
        <button id="loginBtn" class="wallet-btn">🔗 Pi ile Giriş Yap</button>

        <!-- ===== 4. Durum Mesajı ===== -->
        <div id="status" class="status"></div>

        <!-- ===== 5. Ürün Bölümü (Giriş gerektirir) ===== -->
        <div id="productSection">
            <h2 style="font-size: 18px; color: #333; margin: 20px 0 10px;">📦 Ürünler</h2>

            <div class="product">
                <h3>📱 Akıllı Telefon</h3>
                <span class="price">150 Pi</span><br />
                <button class="buy-btn" onclick="alert('Satın alma işlemi yakında aktif olacak.')">Satın Al</button>
            </div>

            <div class="product">
                <h3>🎧 Kablosuz Kulaklık</h3>
                <span class="price">75 Pi</span><br />
                <button class="buy-btn" onclick="alert('Satın alma işlemi yakında aktif olacak.')">Satın Al</button>
            </div>

            <div class="product">
                <h3>⌚ Akıllı Saat</h3>
                <span class="price">200 Pi</span><br />
                <button class="buy-btn" onclick="alert('Satın alma işlemi yakında aktif olacak.')">Satın Al</button>
            </div>
        </div>

        <p class="footer">Pi Trust Protocol v1.0</p>
    </div>

    <!-- ===== 6. JavaScript (Authentication) ===== -->
    <script>
        (function() {
            'use strict';

            // --- DOM Elemanları ---
            const loginBtn = document.getElementById('loginBtn');
            const statusDiv = document.getElementById('status');
            const userInfoDiv = document.getElementById('userInfo');
            const usernameSpan = document.getElementById('usernameDisplay');
            const productSection = document.getElementById('productSection');

            // --- Durum Mesajı ---
            function setStatus(message, isError = false) {
                statusDiv.style.display = 'block';
                statusDiv.textContent = message;
                statusDiv.style.background = isError ? '#ffebee' : '#e8f5e9';
                statusDiv.style.color = isError ? '#c62828' : '#2e7d32';
            }

            function hideStatus() {
                statusDiv.style.display = 'none';
            }

            // --- UI Güncelleme ---
            function updateUI(user) {
                if (user && user.username) {
                    usernameSpan.textContent = user.username;
                    userInfoDiv.classList.add('visible');
                    productSection.classList.add('visible');
                    loginBtn.textContent = '✅ Oturum Açık';
                    loginBtn.disabled = true;
                    hideStatus();
                } else {
                    userInfoDiv.classList.remove('visible');
                    productSection.classList.remove('visible');
                    loginBtn.textContent = '🔗 Pi ile Giriş Yap';
                    loginBtn.disabled = false;
                }
            }

            // --- Backend Doğrulaması (Şimdilik simüle) ---
            async function verifyOnBackend(accessToken) {
                try {
                    // Gerçek backend entegrasyonu için burayı kullan
                    // const response = await fetch('/api/verify-pi', { ... });
                    console.log('Access Token alındı (backend doğrulaması simüle edildi):', accessToken);
                    return true;
                } catch (error) {
                    console.error('Backend doğrulama hatası:', error);
                    return false;
                }
            }

            // --- Ana Authentication Fonksiyonu ---
            async function authenticateWithPi() {
                setStatus('⏳ Pi Browser ile bağlantı kuruluyor...');

                try {
                    // 1. Pi SDK'sını başlat (Promise olarak bekle)
                    await Pi.init({ version: '2.0' });

                    // 2. Kullanıcı kimlik doğrulaması (username scope)
                    const authResult = await Pi.authenticate(['username'], function(error) {
                        // Kullanıcı iptal veya hata durumu
                        console.warn('Auth işlemi tamamlanmadı:', error);
                        setStatus('⚠️ Giriş işlemi tamamlanmadı veya iptal edildi.', true);
                        loginBtn.disabled = false;
                    });

                    // 3. Sonucu kontrol et
                    if (!authResult || !authResult.accessToken || !authResult.user) {
                        throw new Error('Kimlik doğrulama başarısız oldu.');
                    }

                    // 4. Token'ı backend'e gönder ve doğrula
                    const isValid = await verifyOnBackend(authResult.accessToken);
                    if (!isValid) {
                        throw new Error('Backend doğrulaması başarısız.');
                    }

                    // 5. UI güncelle
                    updateUI(authResult.user);
                    setStatus('✅ Giriş başarıyla tamamlandı!');

                } catch (error) {
                    console.error('Auth hatası:', error);
                    setStatus('❌ ' + error.message, true);
                    loginBtn.disabled = false;
                }
            }

            // --- Giriş Butonu Olayı ---
            async function handleLogin() {
                loginBtn.disabled = true;
                setStatus('⏳ Pi Authentication başlatılıyor...');
                await authenticateWithPi();
            }

            // --- Sayfa Yüklendiğinde Otomatik Giriş Dene ---
            window.addEventListener('load', async function() {
                try {
                    // Pi SDK'sını başlat
                    await Pi.init({ version: '2.0' });
                    console.log('Pi SDK hazır.');

                    // Butona tıklama olayını bağla
                    loginBtn.addEventListener('click', handleLogin);

                    // Otomatik giriş dene
                    await authenticateWithPi();
                } catch (error) {
                    console.warn('Pi SDK başlatılamadı:', error);
                    setStatus('⚠️ Pi SDK başlatılamadı. Lütfen Pi Browser üzerinden açın.', true);
                    loginBtn.disabled = false;
                }
            });

            // --- Yardımcı Konsol ---
            console.log('Pi Trust Protocol hazır. Login butonuna tıklayarak giriş yapabilirsiniz.');
        })();
    </script>
</body>
</html>
